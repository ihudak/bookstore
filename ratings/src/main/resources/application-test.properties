## Spring Datasource (Datasource configuration)
spring.jpa.properties.hibernate.dialect = org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.hibernate.show-sql=true

spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.url=jdbc:h2:mem:db;DB_CLOSE_DELAY=-1;MODE=MySQL;IGNORECASE=TRUE
spring.datasource.username=sa
spring.datasource.password=sa

logging.level.root=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type=DEBUG

server.port=${DT_SERVER_PORT:8088}

http.service.orders=http://${DT_ORDERS_SERVER:localhost:8085}/api/v1/orders

spring.banner.location=classpath:banner-test.txt
