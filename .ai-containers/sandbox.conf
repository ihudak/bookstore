# sandbox.conf — optional component configuration for the AI sandbox container.
#
# Boolean components: set to ON to include, OFF (or comment out) to exclude.
# Version-list components: set to a comma-separated list of versions to install,
#   or leave empty (key=) to skip. The latest version is always installed
#   for components that are required by AI agents (node, python).
#   An explicit key=OFF is also accepted and means the same as empty (skip).
#
# Run ./build.sh after changing this file.

# schema-version: 4
# Bumped ONLY when a migrations/ hook is added (a rename/split/removal).
# Plain new keys need no bump. See README "sandbox.conf schema versioning".

# ── AI agents ──────────────────────────────────────────────────────────────────
copilot=ON
kiro=OFF
claude-code=ON
codex=OFF
gemini=OFF
graphify=OFF

# ── Java / JVM (via SDKMAN) ────────────────────────────────────────────────────
# SDKMAN is auto-installed when any JVM component has at least one version listed.
# Specify comma-separated version numbers. Leave empty (e.g. openjdk=) to skip.
#
# IMPORTANT: Version numbers must match SDKMAN's distribution identifiers.
# SDKMAN uses full patch versions (e.g. 21.0.5, 25.0.2), not just major versions.
# Run `sdk list java` inside a container to see available identifiers.
# Examples:
#   openjdk=21.0.11         → installs 21.0.11-tem (Adoptium Temurin)
#   graalvm-ce=25.0.2       → installs 25.0.2-graalce
#   graalvm-oracle=25.0.3   → installs 25.0.3-graal
#
# graalvm-ce    = GraalVM Community Edition (free, open-source). SDKMAN id: <ver>-graalce
# graalvm-oracle = GraalVM Oracle (free for production since 2023). SDKMAN id: <ver>-graal
# Both graalvm variants also install the native-image toolchain.
# maven/gradle/kotlin/scala: specify a version (e.g. maven=3.9.9) or leave empty.
#
# NOTE: SDKMAN itself is always installed at the latest version (get.sdkman.io
# does not support version pinning). Use --no-cache to pick up SDKMAN updates.
openjdk=21.0.12+1.1
graalvm-ce=
graalvm-oracle=
kotlin=
scala=
maven=
gradle=

# ── Node.js (via nvm) ──────────────────────────────────────────────────────────
# The latest LTS is ALWAYS installed (required by AI agents like Copilot, Claude Code).
# List additional versions to install alongside it (comma-separated).
# Example: node=20,22  installs Node 20 and 22 in addition to the always-on latest LTS.
node=

# nvm version — pin the nvm release used to install Node.js.
#
# EMPTY BY DEFAULT, which means "whatever the Dockerfile's ARG NVM_VERSION says".
# It shipped pinned, and that pin was the problem: sync-to-projects.sh never
# touches a key a project already has, so every project carried its own copy of
# the version and the weekly update-nvm-version.yml PR reached none of them. The
# one file that IS refreshed on every sync is the Dockerfile, so keeping the
# version only there means a project on the default tracks it for free.
#
# Set a tag here to pin a project to one nvm release regardless of the image
# default. Check https://github.com/nvm-sh/nvm/releases for versions.
#
# NOTE FOR AN EXISTING PROJECT: your .ai-containers/sandbox.conf still carries
# the tag it was created with, and no sync will clear it. Blank this line once
# and it follows the Dockerfile from then on.
nvm-version=

# ── Python (via pyenv) ─────────────────────────────────────────────────────────
# The latest stable Python is ALWAYS installed.
# List additional versions to install alongside it (comma-separated).
# Example: python=3.12,3.11
#
# NOTE: pyenv itself is always installed at the latest version (pyenv.run does
# not support version pinning). Use --no-cache to pick up pyenv updates.
python=

# ── Ruby (via rvm) ────────────────────────────────────────────────────────────
# Specify a comma-separated list of Ruby versions to install.
# rvm is auto-installed when ruby has a version set.
# Ruby versions and gems persist in the group-mounted ~/.rvm directory across
# container runs. A version's first install compiles at container start.
# Example: ruby=3.4.5,3.3.0  installs both versions; gems persist in ~/.rvm.
# Leave empty to skip.
ruby=

# ── Rust (via rustup) ──────────────────────────────────────────────────────────
# Accepted values: stable, beta, nightly, or a specific version (e.g. 1.87.0).
# Leave empty to skip.
rust=

# ── Go ─────────────────────────────────────────────────────────────────────────
# Specify a version (e.g. go=1.24.2) or leave empty to skip.
# Uses the official go.dev/dl tarball — no version manager needed.
go=

# ── Cloud / infra ──────────────────────────────────────────────────────────────
github-cli=ON
kubectl=OFF
aws-cli=OFF
azure-cli=OFF

# ── Dynatrace ──────────────────────────────────────────────────────────────────
# ON    = auto-detect and install the latest release (requires GitHub API access).
#         If the API is rate-limited, set GITHUB_TOKEN on your host before building,
#         or pin a specific version instead.
# x.y.z = install that exact version — no GitHub API call, fully reproducible.
# OFF   = skip entirely.
#
# NOTE: For dtctl/dtmgd to work in restricted mode, your Dynatrace tenant URL
# must be allowlisted. Add it to allowlist-domains.d/dynatrace.txt (or custom.txt)
# and rebuild. See the dynatrace.txt fragment for details.
dtctl=OFF
dtmgd=OFF

# acli: the official Atlassian CLI (Jira, Confluence, admin, assets, ...).
# GRAMMAR DIFFERS from the other tools: ON | OFF only, no version pinning.
# Atlassian publishes every package behind a "latest" URL (a versioned path
# returns 403) and supports each release for 6 months, so `ON` means whatever is
# current at build time — check with `acli --version`. acli is baked into the
# image at build time (unlike the runtime-installed agent-tier tools), so
# refreshing it means rebuilding: `./build.sh --no-cache` (there is no pinned
# version to bump instead).
# No GITHUB_TOKEN involved: the download is vendor-hosted, not a GitHub release.
# Authenticate ONCE PER CONTAINER GROUP (state is group-scoped in
# ~/.config/acli, and the binary needs no OS keyring):
#   echo "$TOKEN" | acli jira auth login --email you@example.com \
#       --site your-org.atlassian.net --token
# Endpoints are allowlisted via allowlist-domains.d/atlassian.txt.
acli=OFF

# ── Dev tools ──────────────────────────────────────────────────────────────────
# angular-cli: ON = latest, version number = pinned (e.g. 19), OFF = skip.
# SINGLE VERSION ONLY.
# Angular CLI is included because AI coding agents frequently scaffold and
# modify Angular projects. It is not an AI agent itself.
# NOTE: Angular CLI adds ~300–500 MB to the image. Set to OFF if not needed.
angular-cli=21
yarn=OFF
bun=ON

# ── Database clients (language-agnostic) ────────────────────────────────────────
# Comma-separated subset of {pg, mysql, mongo}. Installs CLIENT/dev libraries and
# shells ONLY — never database servers. Serves native DB drivers in any language
# (Ruby pg/mysql2, Python psycopg2/mysqlclient, Node pg-native) and gives agents a
# DB shell (psql / mysql / mongosh). Empty = skip.
#   pg    → libpq-dev + postgresql-client (psql)
#   mysql → default-libmysqlclient-dev + default-mysql-client
#   mongo → mongosh (from MongoDB's apt repo; adds repo.mongodb.org to allowlist)
# Enabling this (or ruby=) also retains a runtime build toolchain so native
# extensions compile at runtime.
db-clients=

# ── Database servers (in-container, for tests) ─────────────────────────────────
# A real database SERVER inside the container, started before your shell appears,
# for test suites that need one. Not db-clients (above), which installs clients
# only. Baked at build time: nothing in the container can install packages once
# the entrypoint has dropped root. See docs/components/postgres.md.
#
# postgres: ON | <major> | OFF  (single value; ON and OFF in capitals)
#   ON       the newest major PGDG (apt.postgresql.org) offers at BUILD time —
#            whatever its own `postgresql` package depends on (18 as of 2026-10).
#            Docker caches the layer, so it stays that major until
#            ./build.sh --no-cache. Pin a major for reproducibility.
#   <major>  e.g. 17. Any major PGDG carries for Ubuntu 24.04 (10-18 as of
#            2026-10; 10-13 are past upstream end of life). A minor (17.2) is
#            refused: PGDG ships only the latest minor of each major.
#   OFF      default.
# Installs the server, its bundled extensions (pgcrypto, tablefunc,
# pg_stat_statements, ...) and psql. NOT libpq-dev: compiling a native driver
# (Ruby pg, Python psycopg2) is still db-clients=pg.
# At container start, as YOUR user (never root): an EMPTY cluster on
# localhost:5432 and the default socket /var/run/postgresql. You are its
# superuser and any password is accepted, so the password in an app's DB config
# is irrelevant — only the role has to exist. Thrown away when the container
# exits: for tests, not for data you want to keep. Works unchanged in restricted
# mode (loopback is always allowed).
# Extra roles and databases, created at every start, go in
# .ai-containers/container.env:
#   POSTGRES_ROLES=app_user,reporting                 (each SUPERUSER LOGIN)
#   POSTGRES_DATABASES=myapp_test:app_user,myapp_dev  (name, or name:owner)
# Cost: ~180 MB of image, ~60 MB RAM idle, ~2 s added to container start.
# Changing this value without rebuilding starts the OLD server with a warning;
# ./runme.sh rebuilds first, so that only happens with a bare ./sandbox.sh.
postgres=ON
#
# redis: ON | OFF  (ON and OFF in capitals)
#   ON       Ubuntu 24.04's redis-server (7.0). No version can be pinned: the
#            archive carries one.
#   OFF      default.
# At container start, as YOUR user (never root): redis://localhost:6379, on the
# IPv4 and IPv6 loopback only, no password, and nothing written to disk (no
# snapshots, no append-only file). Thrown away when the container exits. For the
# suites and dev servers that expect one (Sidekiq, Action Cable, Celery, BullMQ,
# a cache). Works unchanged in restricted mode. See docs/components/redis.md.
# Cost: ~9 MB of image, ~11 MB RAM idle, under 0.1 s added to container start.
redis=OFF
#
# mysql: ON | OFF  (ON and OFF in capitals)
#   ON       Ubuntu 24.04's mysql-server (8.0, patched by Ubuntu; upstream 8.0
#            reached end of life in April 2026). No version can be pinned: the
#            archive carries one.
#   OFF      default.
# At container start, as YOUR user (never root): localhost:3306 (IPv4 and IPv6
# loopback) and the socket /var/run/mysqld/mysqld.sock. root and your own user
# have NO password, so a bare `mysql` connects, and so does an app configured
# for root with an empty password (Rails' default). Thrown away when the
# container exits. Works unchanged in restricted mode. Not MariaDB, whose SQL
# has drifted from MySQL 8's. See docs/components/mysql.md.
# Extra users and databases, created at every start, go in
# .ai-containers/container.env:
#   MYSQL_USERS=app_user,reporting:s3cret   (name, or name:password; all privileges)
#   MYSQL_DATABASES=myapp_test,myapp_dev
# Cost: ~285 MB of image, ~150 MB RAM idle, under 1 s added to container start.
mysql=ON
#
# mariadb: ON | <series> | OFF  (single value; ON and OFF in capitals)
#   ON        Ubuntu 24.04's mariadb-server (10.11), no third-party repository.
#   <series>  e.g. 11.4 — any series MariaDB publishes for Ubuntu 24.04, from its
#             own repository (10.11, 11.4, 11.8 and 12.3 are long-term series as
#             of 2026-10). A release (11.4.5) is refused: the repository
#             installs the newest of its series.
#   OFF       default.
# For projects whose PRODUCTION runs MariaDB; a MySQL app tests against mysql=
# (MariaDB's SQL has drifted from MySQL 8's). Not together with mysql=: both
# serve localhost:3306 and the same socket. Behaves like mysql= above — your
# own account and root with no password, the same MYSQL_USERS / MYSQL_DATABASES
# — with the package's own character set (utf8mb4). See docs/components/mariadb.md.
# Cost: ~295 MB of image, ~125 MB RAM idle, under 2 s added to container start.
mariadb=OFF
#
# mongo: ON | <series> | OFF  (single value; ON and OFF in capitals)
#   ON        the 8.0 series, from MongoDB's own apt repository (the one
#             db-clients=mongo uses).
#   <series>  e.g. 8.2 — any series MongoDB publishes for Ubuntu 24.04 (8.0, 8.2
#             and 8.3 as of 2026-10; none before 8.0). A release (8.0.32) is
#             refused: the repository installs the newest of its series.
#   OFF       default.
# Installs mongod and mongosh. At container start, as YOUR user (never root):
# mongodb://localhost:27017, IPv4 and IPv6 loopback only, no authentication, the
# WiredTiger cache capped at 0.25 GB (its default would take 1.5 GB of a 4 GB
# container). Nothing to create: a database exists once something writes to it.
# Thrown away when the container exits. Works unchanged in restricted mode.
# x86-64 needs a CPU with AVX (every MongoDB since 5.0). See docs/components/mongo.md.
# Cost: ~525 MB of image (mongod ~215 MB, mongosh ~290 MB), ~165 MB RAM idle,
# under 1 s added to container start.
mongo=OFF

# c-toolchain: ON keeps a C compiler and headers (build-essential, libyaml-dev,
# zlib1g-dev, libssl-dev) in the finished image. Needed by anything that
# compiles C INSIDE the container — cgo (`go test -race`), or a gem/wheel/npm
# package with a native extension built at install time. Implied already when
# `ruby` or `db-clients` is set, so this key is for projects that need a
# compiler without either of those. See docs/components/c-toolchain.md.
c-toolchain=OFF

# ── Image + PDF tooling ─────────────────────────────────────────────────────────
# imagemagick: ON installs ImageMagick (mini_magick / image_processing / carrierwave).
imagemagick=OFF
# wkhtmltopdf: ON installs the wkhtmltopdf runtime libraries (so a gem-vendored
# binary runs) plus the official standalone binary. Off by default.
wkhtmltopdf=OFF

# pnpm: fast, disk-efficient Node package manager (https://pnpm.io). ON installs
# the latest pnpm globally via npm at build time (corepack ships with Node, but a
# non-root sandbox user can't enable it at runtime — the nvm dir is root-owned).
pnpm=OFF

# goreleaser: release automation for Go (and other) projects. ON installs the
# latest GoReleaser OSS from the official apt repository. Does not require Go to
# be enabled — the binary is self-contained. Set to OFF to skip.
goreleaser=OFF

# vale: prose/style linter for docs (https://vale.sh). ON installs the latest
# Vale binary from GitHub releases (vale-cli/vale) — a single self-contained Go
# binary, no extra deps. NOT baked into the image: like the other agent-tier
# tools it installs at CONTAINER START into the group-mounted ~/.ai-tools
# (agent-tools-reconcile.sh), so `--no-cache` does not refresh it and it
# self-updates in place. Handy in docs workspaces whose style-check phase
# otherwise warns that "Vale isn't installed". Set OFF to skip.
vale=OFF

# qmd: on-device markdown search engine (https://github.com/tobi/qmd).
# Set to ON when you plan to use VAULT_PATH (an Obsidian vault or any markdown
# corpus, mounted at /workspace/vault) or
# any markdown notes/docs collection inside the container. ON installs
# @tobilu/qmd globally via npm at build time.
qmd=OFF

# shellcheck: the shell linter this repo gates on. ON installs Ubuntu's package,
# which on the ubuntu:24.04 base is the SAME VERSION the CI gate runs — CI pins
# `runs-on: ubuntu-24.04`, so a finding here is a finding there and vice versa.
# That equivalence is the point: a newer shellcheck (Homebrew's, say) reports
# findings the gate does not, and a developer chasing them is fixing a lint that
# is not the one blocking the merge.
#
# Turn this ON in any project whose work is shell scripts -- above all this
# engine's own checkout, where `verify-on-host.sh` Phase 7 and
# hermetic-checks.yml's `lint` job both gate on shellcheck and a container
# without it cannot check its own work before pushing.
shellcheck=OFF

# ── Browser automation ─────────────────────────────────────────────────────────
# playwright: installs the OS packages Playwright's browsers link against
# (libnss3, libgbm1, libatk-bridge2.0-0t64, the font packages, ...) by asking
# Playwright itself for the list — the same `install-deps` its own docs tell you
# to run. Accepted values:
#   ON     = use whatever `playwright@latest` wants AT BUILD TIME.
#   x.y.z  = pin the Playwright version whose dependency list is used, e.g.
#            playwright=1.58.2. Reproducible. SINGLE VERSION ONLY.
#   OFF    = skip entirely (default).
# ON and OFF must be CAPITALS: any other value is read as a version, so
# `playwright=on` would become `npx playwright@on`. build.sh refuses that up
# front. npm dist-tags are legitimate versions here (playwright=next works).
#
# THIS CANNOT BE DONE AT RUNTIME. entrypoint.sh permanently drops root via
# `capsh --user=` before the agent shell starts, so nothing inside the container
# can apt-get install. It is baked at build time or it is not there at all.
#
# NOTE: adds several hundred MB to the image (deps for chromium + firefox +
# webkit; webkit's gstreamer/libavif set is the bulk of it).
#
# NOTE: the OS deps are baked, the BROWSERS are not. Run `npx playwright install`
# inside the container once; sandbox.sh group-mounts ~/.cache/ms-playwright, so
# that download survives the container exiting and is shared across the group.
#
# NOTE: an unpinned ON resolves "latest" AT BUILD TIME and Docker then caches the
# layer — a newer Playwright needs `./build.sh --no-cache`, or pin a version.
#
# NOTE ON RESOURCES: headless Chromium needs more than the container defaults.
# sandbox.sh raises /dev/shm to 1g automatically when this key is active
# (CONTAINER_SHM_SIZE overrides it) — CONTAINER_MEMORY does NOT govern /dev/shm,
# and Chromium crashes on Docker's 64MB default no matter how much RAM it has.
# Also consider CONTAINER_CPUS=4 CONTAINER_MEMORY=8g CONTAINER_MEMORY_SWAP=8g.
# See docs/components/playwright.md.
playwright=ON
