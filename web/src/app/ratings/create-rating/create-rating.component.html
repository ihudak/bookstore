<div class="col-md-6 offset-md-3">
  <h3>Create Rating</h3>
  <form (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label>e-mail</label>
      <input type="text" class="form-control" id="email" [(ngModel)] = "email" name="email">
    </div>
    <br>
    <div class="form-group">
      <label>ISBN</label>
      <input type="text" class="form-control" id="isbn" [(ngModel)] = "isbn" name="isbn">
    </div>
    <br>
    <div class="form-group">
      <app-star-choice [(stars)]="stars" name="give-stars"></app-star-choice>
    </div>
    <br>
    <div class="form-group">
      <label>Comment</label>
      <input type="text" class="form-control" id="comment" [(ngModel)] = "comment" name="comment">
      <small class="form-text d-block">{{ commentNote }}</small>
      <small class="form-text d-block">{{ keepCommentNote }}</small>
    </div>
    <br>

    <br>
    <button class="btn btn-success" type="submit" [disabled]="!canSubmit">Submit</button>
    <div role="alert">{{ outcomeText }}</div>
  </form>
</div>
